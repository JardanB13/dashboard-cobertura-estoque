  --bar:#07101f; --bar-ink:#eaf1ff; --bar-ink-2:#8fa3c8;
  --accent:#5b9bff; --accent-soft:#16264a; --accent-ink:#a9c8ff;
  --b1:#22c55e; --b2:#eab308; --b3:#f97316; --b4:#f87171;
  --warn:#f5b451; --warn-bg:#3a2a12; --crit:#ff8a7a; --crit-bg:#3b1a18; --ok:#4ade80; --ok-bg:#12301f;
  --sim:#b794ff; --sim-bg:#271a45; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* App bar */
.appbar{background:var(--bar);color:var(--bar-ink);padding-inline:var(--gut);padding-block:18px 20px;position:relative}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--h1),var(--h2),var(--h3),var(--h4),var(--h5))}
.appbar .in{max-width:1480px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.appbar .kick{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--bar-ink-2);margin-bottom:8px}
.appbar h1{margin:0;font:800 clamp(22px,2.6vw,30px)/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.appbar .meta{font-size:12px;color:var(--bar-ink-2);text-align:right;line-height:1.6}
.appbar .meta b{color:var(--bar-ink);font-weight:500}
.src{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.src span{font-size:10.5px;padding:1px 8px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--bar-ink-2)}

.wrap{max-width:1480px;margin:0 auto;padding-inline:var(--gut);padding-block:18px 40px;display:grid;gap:16px}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end}
.field{display:grid;gap:5px;flex:0 1 190px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field select,.field input{height:38px;padding:0 12px;width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px}
.field select:hover,.field input:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;cursor:pointer}
.chip span{opacity:.7;font-size:15px;line-height:1}
.grow{flex:1}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn.sim{border-color:var(--sim);color:var(--sim)}
.btn.sim.on{background:var(--sim);color:#fff}

/* Indicadores (3) */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 22px;box-shadow:var(--shadow);min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.kpi .v{font:700 30px/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .l{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi .s{margin-top:2px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Simulação */
.simbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--sim-bg);border:1px solid color-mix(in srgb,var(--sim) 40%,transparent);border-radius:var(--r);padding:12px 16px;color:var(--ink)}
.simbar b{color:var(--sim)}
.simbar .d{display:grid;gap:1px}
.simbar .d span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.simbar .d strong{font:600 15px var(--f-mono)}
.up{color:var(--crit)} .down{color:var(--ok)}

/* Mapa + painel */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.mapcard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);height:clamp(580px,72vh,800px);background:var(--surface-2)}
#map{position:absolute;inset:0}
.ov{position:absolute;z-index:3}
.ov-top{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;pointer-events:none}
.ov-top>*{pointer-events:auto}
.seg{display:inline-flex;flex:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{height:32px;padding:0 10px;border:0;background:transparent;border-left:1px solid var(--line);font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.legend{left:12px;bottom:30px;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:11px;color:var(--ink-2);width:250px;box-shadow:var(--shadow)}
.legend .t{font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ramp{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--h1),var(--h2),var(--h3),var(--h4),var(--h5))}
.scale{display:flex;justify-content:space-between;color:var(--ink-3)}
.rad{display:flex;gap:8px;align-items:center}
.rad input{flex:1;accent-color:var(--h3)}
.syms{display:flex;gap:12px}
.syms i{display:inline-block;vertical-align:-1px;margin-right:5px}
.i-city{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0f2240}
.i-hub{width:11px;height:11px;border-radius:3px;background:#1e6bff;box-shadow:0 0 0 2px #fff}
.i-aprox{width:10px;height:10px;border-radius:50%;border:2px dashed #f98d2b}
.bands{display:flex;flex-wrap:wrap;gap:4px 10px}
.bands i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1.5px #fff}
.mini-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.mini-seg button{border:0;background:none;font-size:10.5px;padding:2px 7px;cursor:pointer;color:var(--ink-3)}
.mini-seg button.on{background:var(--accent);color:#fff}
.notice{left:50%;top:56px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow)}
.nomap{position:absolute;inset:0;z-index:4;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;background:var(--surface-2);color:var(--ink-2);font-size:13px;max-width:none}
.nomap b{color:var(--ink);font-size:15px}
.nomap span{max-width:52ch;margin:0 auto}
.simhint{left:50%;bottom:30px;transform:translateX(-50%);background:var(--sim);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.maplibregl-popup-content{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.18);padding:9px 11px;font:12px/1.45 var(--f-body)}
.maplibregl-popup-tip{display:none}
.pp{min-width:250px}
.eqb{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.eqb .eh{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.eqb .es{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:7px}
.eqb .es div{background:var(--surface-2);border-radius:6px;padding:5px 7px;border-left:3px solid var(--c);min-width:0}
.eqb .es b,.pp .eqb .es b{display:block;margin:0;font:700 15px/1.15 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.eqb .es span{display:block;font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqb table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.eqb th,.eqb td{padding:3px 5px;height:auto;text-align:right;white-space:nowrap;position:static;cursor:default;font-family:var(--f-mono)}
.eqb th{font-family:var(--f-body);font-size:10px;letter-spacing:.05em;background:transparent}
.eqb tbody tr:hover,.eqb tbody tr:nth-child(even){background:transparent}
.eqb th:first-child,.eqb td:first-child{text-align:left;white-space:normal;font-family:var(--f-body)}
.eqb th{color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line)}
.eqb td{border-bottom:1px solid var(--line)}
.eqb tr:last-child td{border-bottom:0}
.eqb .none{font-size:11px;color:var(--ink-3)}
.side .eqb{margin-top:10px}
.f-eq{margin-top:4px;font-size:11px;color:var(--ink-2)}
.f-eq b{font-family:var(--f-mono)}
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}

.pp b{display:block;font-size:13px;margin-bottom:4px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.pp dt{color:var(--ink-3)} .pp dd{margin:0}
.hubmk{display:flex;align-items:center;gap:6px;cursor:pointer;transform-origin:left center}
.hubmk .sq{width:14px;height:14px;border-radius:4px;background:#1e6bff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);flex:none}
.hubmk .lb{background:#0f2240;color:#fff;border-radius:6px;padding:2px 7px;font:700 11px/1.3 var(--f-display);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hubmk.sel .sq{background:#e8445a;width:18px;height:18px}
.hubmk.moved .sq{background:#7c3aed}
.hubmk.drag{cursor:grab}
.hubmk.hide-lb .lb{display:none}
.maplibregl-ctrl-attrib{font-size:10px}

.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;max-height:clamp(580px,72vh,800px)}
.side header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.side h2{margin:0;font:700 15px/1.2 var(--f-display)}
.side header span{font-size:11px;color:var(--ink-3)}
.rank{list-style:none;margin:0;padding:6px;overflow:auto}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.rank li:hover{background:var(--surface-2)}
.rank li.off{opacity:.4}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rank .nm small{margin-left:6px;color:var(--ink-3);font-weight:400}
.rank .ct{font:600 13px var(--f-mono)}
.gbar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--h1),var(--h3) 70%,var(--h4))}
.stack{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.side .hd{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.back{justify-self:start;border:0;background:none;padding:0;color:var(--accent-ink);font-size:12px;font-weight:600;cursor:pointer}
.back:hover{text-decoration:underline}
.side .hd h2{font:800 20px/1.15 var(--f-display);margin:0}
.side .hd h2 small{font:600 12px var(--f-body);color:var(--ink-3);margin-left:4px}
.hd-sub{font-size:12px;color:var(--ink-3);margin-top:-4px}
.hd-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hd-kpis div{padding:8px 9px 7px;display:grid;gap:2px;border-left:1px solid var(--line);border-top:1px solid var(--line);min-width:0}
.hd-kpis div:nth-child(3n+1){border-left:0}
.hd-kpis div:nth-child(-n+3){border-top:0}
.hd-kpis b{font-size:16px;line-height:1.1;color:var(--ink)}
.hd-kpis span{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-tools{display:flex;gap:8px}
.hd-tools input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);font-size:12px}
.clist{overflow:auto;padding:4px 8px 12px;flex:1;min-height:0}
.cgroup h3{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:10px 8px 6px;background:var(--surface);font:700 12px/1 var(--f-display);letter-spacing:.06em}
.cgroup h3 em{font:500 11px var(--f-body);font-style:normal;color:var(--ink-3)}
.cgroup ol{list-style:none;margin:0;padding:0}
.cgroup li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.cgroup li:hover{background:var(--surface-2)}
.cgroup .idx{font-size:11px;color:var(--ink-3);text-align:right}
.cgroup .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgroup .dist{font-size:12px;color:var(--ink-2);text-align:right}
.cgroup .dist small{display:block;font-size:10.5px;color:var(--ink-3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.tag{font-style:normal;font-size:10px;font-weight:600;line-height:16px;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--accent-soft);color:var(--accent-ink)}
.tag.sim{background:var(--sim-bg);color:var(--sim)}

/* Resultado da busca */
.found{list-style:none;margin:0;padding:8px;overflow:auto;display:grid;gap:8px;align-content:start}
.found li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;cursor:pointer}
.found li:hover{border-color:var(--accent)}
.f-top b{font:700 15px var(--f-display)} .f-top small{color:var(--ink-3);margin-left:4px}
.f-hub{font-size:12px;color:var(--ink-2)}
.f-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.f-kv div{background:var(--surface-2);border-radius:6px;padding:6px 8px;min-width:0}
.f-kv dt{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.f-kv dd{margin:0;font-size:13px;font-weight:600;white-space:nowrap}

/* Tempo e distância */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:grid;gap:14px}
.card h3{margin:0;font:700 16px/1.2 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 span{font:500 12px var(--f-body);color:var(--ink-3)}
.td-grid{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:18px;align-items:start}
.td-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.td-sum div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px;min-width:0}
.td-sum dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.td-sum dd{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.td-sum small{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-list{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.td-list .sh{display:none}
.td-list .alm-m{display:none;font-size:11.5px;color:var(--ink-3)}
@media (max-width:640px){.td-list .lg{display:none}.td-list .sh{display:inline}.td-list th,.td-list td{padding-inline:8px}.td-list td:first-child{white-space:normal}.card.td{padding:14px 12px}.td-list .col-alm{display:none}.td-list .alm-m{display:block}.td-list td{height:auto;padding-block:7px}}
.td-list th{cursor:pointer}
.td-list td b{font-weight:600} .td-list td small{color:var(--ink-3);margin-left:4px}
.td-list td.muted{color:var(--ink-2)}
.td-tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.td-tbl th{cursor:default}
.td-tbl tr.sel{background:var(--accent-soft)}

/* Tabelas (virtualizadas) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:46px;padding:0 12px;border:0;background:none;border-bottom:3px solid transparent;color:var(--ink-3);cursor:pointer;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font:600 11px/19px var(--f-mono);padding:0 7px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tab.on .badge{background:var(--accent);border-color:var(--accent);color:#fff}
.tbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-size:12px;color:var(--ink-3)}
.tbar .acts{display:flex;gap:8px}
.twrap{overflow:auto;height:min(520px,60vh);position:relative}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:0 14px;height:37px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tbody tr.go{cursor:pointer}
tr.spacer td{border:0;padding:0;height:auto}
td.wrap{white-space:normal;min-width:300px;color:var(--ink-2)}
.pill{display:inline-block;font-size:11px;font-weight:500;line-height:20px;padding:0 9px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.pill.crit{background:var(--crit-bg);border-color:transparent;color:var(--crit)}
.pill.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.pill.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.hbar{display:inline-block;height:7px;border-radius:4px;margin-right:8px;vertical-align:middle;background:linear-gradient(90deg,var(--h1),var(--h3))}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.foot{font-size:12px;color:var(--ink-3);max-width:120ch;line-height:1.6;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:2000;box-shadow:var(--shadow)}
.boot{max-width:1480px;margin:0 auto;padding-inline:var(--gut);padding-block:24px;color:var(--ink-3)}

@media (max-width:900px){.td-grid{grid-template-columns:1fr}}
@media (max-width:1020px){.main{grid-template-columns:1fr}.side{max-height:460px}}
@media (max-width:640px){
  .kpis{gap:8px}.kpi{padding:12px 10px 12px 14px}.kpi .v{font-size:22px}.kpi .l{font-size:10px;letter-spacing:.04em}.kpi .s{display:none}
  .field{flex:1 1 140px}.grow{display:none}.appbar .meta{text-align:left}.src{justify-content:flex-start}
  .mapcard{height:540px}.legend{width:auto;right:56px;bottom:34px}.legend .hide-m{display:none}
  .ov-top{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Marcadores de almoxarifado: só o quadrado quando selecionado */
.hubmk .sq{position:relative;width:14px;height:14px;border-radius:4px;background:#1e6bff;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(15,34,64,.35),0 2px 6px rgba(0,0,0,.35);transition:transform .18s ease,background .18s ease,opacity .18s ease}
.hubmk:hover .sq{transform:scale(1.2)}

.hubmk.sel .sq{width:14px;height:14px;background:#1e6bff;transform:scale(1.6);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 4px 14px rgba(30,107,255,.55)}

/* Painel lateral */

.side .hd h2::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:#1e6bff;margin-right:9px;vertical-align:1px;box-shadow:0 0 0 2px var(--surface)}

/* Cartões e tabelas */
.card h3,.panel .tabs{letter-spacing:-.005em}

th{letter-spacing:.06em}
tbody tr:nth-child(even):not(.spacer){background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
tbody tr:hover{background:var(--accent-soft)}
@media (max-width:640px){.appbar .meta{justify-items:start}.appbar .meta .pills{justify-content:flex-start}}
/* ===== Indicadores agrupados v3 ===== */
.kpis{display:grid;grid-template-columns:2fr 3fr;gap:14px}
.kg{display:grid;gap:8px;min-width:0;grid-template-rows:auto 1fr}

.kpi .ico{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.kpi .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.kpi .bar i{display:block;height:100%;border-radius:inherit;background:var(--c);transition:width .4s ease}
.kpi .bar + .s{margin-top:6px}
.kpi .s{margin-top:auto;padding-top:4px}
.kpi .bar + .s{padding-top:0}
@media (max-width:1100px){.kpis{grid-template-columns:1fr}}
@media (max-width:640px){
  .kg-c,.kg.eq .kg-c{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kg.eq .kpi:last-child{grid-column:1/-1}
  .kpi .ico{width:26px;height:26px;top:10px;right:10px}.kpi .ico svg{width:14px;height:14px}
  .kpi .v{padding-right:30px}
  .kpi .bar + .s{display:block;font-size:11px}
}
.appbar h1 .mes{font-weight:500;color:var(--bar-ink-2);margin-left:.25em}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot" class="boot">Carregando painel…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="cobertura.js"></script>
<script src="equipamentos.js"></script>
<script src="ufs.js"></script>
<script>
"use strict";
/* ==========================================================================
   Arquitetura (Vue 3 · Composition API · MapLibre GL / WebGL)
   domain      normalização única dos dados + funções puras (haversine, faixas)
   store       estado reativo (filtros, camadas, abas, simulação) + actions + sync com a URL
   sel         seletores computed: linhas efetivas (reais ou simuladas) → filtradas
   components  AppBar · FilterBar · KpiStrip · SimBar · MapPanel · SidePanel · Intel · DataTabs(virtual)
   MapPanel    MapLibre imperativo fora da reatividade; GeoJSON reconstruído a cada mudança de dados
   ========================================================================== */
const {createApp, reactive, computed, watch, ref, onMounted, onBeforeUnmount, markRaw, nextTick} = Vue;

/* ------------------------------- domain ------------------------------- */
const RAW = window.DADOS_COBERTURA;
const GEO = window.DADOS_UFS;
const ENR = !!RAW.meta.enriquecido;
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nf0 = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const pct = new Intl.NumberFormat("pt-BR", {style: "percent", minimumFractionDigits: 0, maximumFractionDigits: 1});
const groupBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map());
const mean = a => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const sum = a => a.reduce((s, x) => s + (x || 0), 0);
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const hav = (la1, lo1, la2, lo2) => { const R = 6371.0088, r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2
  + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); };
const fmtMin = m => (m == null ? "–" : m < 60 ? `${nf0.format(m)} min` : `${Math.floor(m / 60)}h${String(Math.round(m % 60)).padStart(2, "0")}`);

const BANDS = [
  {k: "até 2h", max: 120, c: "#16a34a", css: "var(--b1)"}, {k: "2–4h", max: 240, c: "#ca8a04", css: "var(--b2)"},
  {k: "4–6h", max: 360, c: "#ea580c", css: "var(--b3)"}, {k: "acima de 6h", max: Infinity, c: "#dc2626", css: "var(--b4)"},
];
const bandOf = min => BANDS.findIndex(b => min <= b.max);

const HUBS0 = RAW.hubs.map(h => Object.freeze({...h}));
const HUB0 = new Map(HUBS0.map(h => [h.id, h]));
const BASE_ROWS = Object.freeze(RAW.rows.map((r, i) => Object.freeze({
  ...r, i, key: `${r.c}|${r.uf}`, q: fold(r.c),
  km: r.km ?? r.d * 1.3, min: r.min ?? (r.d * 1.3) / 60 * 60,
  aprox: r.s === "Aproximada" || r.s === "Localidade sem geocódigo" || r.s === "Localidade (não é município)",
})));

/* Equipamentos (SINAPSE): novos x reaproveitados x retirados por cidade */
const EQ = window.DADOS_EQUIPAMENTOS;
const eqOf = r => EQ.c[`${fold(r.c).trim()}|${r.uf}`] || null;
const eqSum = rows => { const s = {n: 0, r: 0, t: 0, os: 0, nat: {}, cid: 0}, seen = new Set();
  rows.forEach(x => { if (seen.has(x.key)) return; seen.add(x.key); const e = eqOf(x); if (!e) return; s.cid++;
    s.n += e.n; s.r += e.r; s.t += e.t; s.os += e.os;
    Object.entries(e.nat).forEach(([k, v]) => { const a = s.nat[k] || (s.nat[k] = [0, 0, 0]); v.forEach((q, j) => { a[j] += q; }); }); });
  return s; };
const eqHtml = (s, full = false) => {
  const ap = s.n + s.r, rp = ap ? pct.format(s.r / ap) : "–";
  const nat = Object.entries(s.nat).map(([k, v]) => ({k, n: v[0], r: v[1], t: v[2], tot: v[0] + v[1] + v[2]}))
    .filter(x => x.tot).sort((a, b) => b.tot - a.tot);
  const list = full ? nat : nat.slice(0, 6);
  const head = `<div class="eh"><span>Equipamentos · ${EQ.meta.periodo}</span><span>${nf0.format(s.os)} OS</span></div>`;
  if (!ap && !s.t) return `<div class="eqb">${head}<div class="none">Sem movimentação de equipamentos no relatório.</div></div>`;
  return `<div class="eqb">${head}<div class="es">
      <div style="--c:var(--accent)"><b>${nf0.format(s.n)}</b><span>Novos</span></div>
      <div style="--c:var(--ok)"><b>${nf0.format(s.r)}</b><span>Reaprov. · ${rp}</span></div>
      <div style="--c:var(--warn)"><b>${nf0.format(s.t)}</b><span>Retirados</span></div></div>
    <table><thead><tr><th>Natureza</th><th>Novos</th><th>Reap.</th><th>Ret.</th></tr></thead><tbody>
    ${list.map(x => `<tr><td>${esc(x.k)}</td><td>${nf0.format(x.n)}</td><td>${nf0.format(x.r)}</td><td>${nf0.format(x.t)}</td></tr>`).join("")}
    ${nat.length > list.length ? `<tr><td colspan="4" class="none">+ ${nat.length - list.length} naturezas</td></tr>` : ""}</tbody></table></div>`;
};
const UFS = [...new Set(BASE_ROWS.map(r => r.uf))].sort();

/* -------------------------------- store ------------------------------- */
const safeLS = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* sem armazenamento */ } }};
const TABS = ["cob", "alm", "uf", "realoc", "corr"];
const store = reactive({
  f: {hub: "", uf: "", band: "", q: ""},
  layers: {heat: true, cities: true, hubs: true, links: false, realoc: false, cluster: false},
  weight: "cidades", base: "escuro", radiusKm: 30,
  tab: TABS.includes(safeLS.get("cob.tab")) ? safeLS.get("cob.tab") : "cob",
  sort: {}, focus: null, toast: "",
  sim: {on: false, pos: {}},
});
let toastT;
const actions = {
  setFilter(k, v) { store.f[k] = v; store.focus = null; },
  toggleHub(id) { store.f.hub = store.f.hub === id ? "" : id; store.focus = null; },
  reset() { Object.assign(store.f, {hub: "", uf: "", band: "", q: ""}); store.focus = null; },
  toast(msg) { store.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => { store.toast = ""; }, 2600); },
  toggleSim() { store.sim.on = !store.sim.on; if (!store.sim.on) store.sim.pos = {}; },
  moveHub(id, lat, lon) { store.sim.pos = {...store.sim.pos, [id]: [lat, lon]}; },
  resetSim() { store.sim.pos = {}; },
};

// Filtros ↔ URL (#hub=A030&uf=CE): permite compartilhar uma visão já filtrada
const readHash = () => { try {
  const p = new URLSearchParams(location.hash.slice(1));
  ["hub", "uf", "band", "q"].forEach(k => { if (p.get(k)) store.f[k] = p.get(k); });
  if (store.f.hub && !HUB0.has(store.f.hub)) store.f.hub = "";
} catch { /* hash indisponível */ } };
readHash();
watch(() => ({...store.f}), f => { try {
  const p = new URLSearchParams(Object.entries(f).filter(([, v]) => v));
  history.replaceState(null, "", p.toString() ? `#${p}` : location.pathname + location.search);
} catch { /* ambiente sem history */ } });

/* ---------------------------- selectors ------------------------------ */
// Sedes efetivas (posição simulada quando movida) e linhas recalculadas para sedes movidas
const hubs = computed(() => HUBS0.map(h => { const p = store.sim.pos[h.id];
  return p ? {...h, lat: p[0], lon: p[1], moved: true} : h; }));
const HUBm = computed(() => new Map(hubs.value.map(h => [h.id, h])));
const rowsEff = computed(() => {
  const moved = store.sim.pos;
  return BASE_ROWS.map(r => {
    const h = HUBm.value.get(r.h);
    if (!moved[r.h]) return {...r, hub: h, fxI: bandOf(r.min), inter: r.uf !== h.uf};
    const d = hav(h.lat, h.lon, r.lat, r.lon), km = d * h.f, min = km / h.v * 60;
    return {...r, hub: h, d, km, min, fxI: bandOf(min), inter: r.uf !== h.uf, simulado: true};
  });
});
const match = (r, f, ignoreHub = false) => (ignoreHub || !f.hub || r.h === f.hub) && (!f.uf || r.uf === f.uf)
  && (f.band === "" || r.fxI === +f.band) && (!f.q || r.q.includes(fold(f.q.trim())));
const sel = {
  rows: computed(() => rowsEff.value.filter(r => match(r, store.f))),
  rowsNoHub: computed(() => rowsEff.value.filter(r => match(r, store.f, true))),
};
const stats = rows => ({
  n: rows.length, km: mean(rows.map(r => r.km)), min: mean(rows.map(r => r.min)),
  ate2h: rows.length ? rows.filter(r => r.fxI === 0).length / rows.length : 0,
  maxMin: Math.max(0, ...rows.map(r => r.min)), pop: sum(rows.map(r => r.pop)),
});
const baseline = computed(() => stats(BASE_ROWS.map(r => ({...r, fxI: bandOf(r.min)}))));

/* ------------------------------ components ---------------------------- */
const MES_EXT = {jan: "Janeiro", fev: "Fevereiro", mar: "Março", abr: "Abril", mai: "Maio", jun: "Junho",
  jul: "Julho", ago: "Agosto", set: "Setembro", out: "Outubro", nov: "Novembro", dez: "Dezembro"};
const AppBar = {
  template: `<header class="appbar"><div class="in">
      <h1>Cobertura Estoque <span class="mes">{{ mes }}</span></h1>
    </div></header>`,
  setup: () => ({mes: MES_EXT[String(EQ.meta.periodo || "").slice(0, 3).toLowerCase()] || ""}),
};

const FilterBar = {
  template: `<section class="filters" aria-label="Filtros">
      <div class="field"><label for="fHub">Almoxarifado</label>
        <select id="fHub" :value="f.hub" @change="set('hub', $event.target.value)"><option value="">Todos</option>
          <option v-for="h in hubsSorted" :key="h.id" :value="h.id">{{ h.nome }} · {{ h.uf }}</option></select></div>
      <div class="field"><label for="fQ">Buscar cidade</label>
        <input id="fQ" type="search" placeholder="Ex.: Jacobina" autocomplete="off" :value="f.q" @input="onQ"></div>
      <div class="chips"><button v-for="c in chips" :key="c.k" class="chip" type="button" @click="set(c.k, '')" :title="'Remover filtro ' + c.t">{{ c.t }} <span>×</span></button></div>
      <div class="grow"></div>
      <button class="btn sim" :class="{on: sim.on}" type="button" @click="toggleSim" :aria-pressed="sim.on"
        title="Arraste as sedes no mapa para ver o efeito nas distâncias">{{ sim.on ? "Sair da simulação" : "Simular sedes" }}</button>
      <button class="btn" type="button" @click="reset">Limpar filtros</button>
    </section>`,
  setup() {
    const hubsSorted = [...HUBS0].sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    let t; const onQ = e => { clearTimeout(t); t = setTimeout(() => actions.setFilter("q", e.target.value), 120); };
    const chips = computed(() => [
      store.f.hub && {k: "hub", t: HUB0.get(store.f.hub)?.nome}, store.f.uf && {k: "uf", t: `UF ${store.f.uf}`},
      store.f.band !== "" && {k: "band", t: BANDS[+store.f.band]?.k}, store.f.q && {k: "q", t: `“${store.f.q}”`}].filter(Boolean));
    return {f: store.f, sim: store.sim, hubsSorted, ufs: UFS, bands: BANDS, chips, onQ, set: actions.setFilter, reset: actions.reset, toggleSim: actions.toggleSim};
  },
};

const KPI_ICO = {
  hub: '<path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9 20v-6h6v6"/>',
  city: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  novo: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  reap: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
  ret: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
};
const KpiStrip = {
  template: `<section class="kpis" aria-live="polite">
      <div v-for="g in groups" :key="g.t" class="kg" :class="g.cls">
        <div class="kg-h"><span>{{ g.t }}</span><em v-if="g.x">{{ g.x }}</em></div>
        <div class="kg-c">
          <div v-for="k in g.items" :key="k.l" class="kpi" :style="{'--c': k.c}">
            <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" v-html="k.i"></svg></span>
            <div class="v">{{ k.v }}</div><div class="l">{{ k.l }}</div>
            <div v-if="k.p != null" class="bar" role="img" :aria-label="k.s"><i :style="{width: (k.p * 100) + '%'}"></i></div>
            <div class="s">{{ k.s }}</div></div>
        </div>
      </div>
    </section>`,
  setup() {
    const groups = computed(() => {
      const rows = sel.rows.value, e = eqSum(rows), apl = e.n + e.r;
      const pn = apl ? e.n / apl : null, pr = apl ? e.r / apl : null;
      return [
        {t: "Cobertura", cls: "cov", items: [
          {l: "Almoxarifados", v: nf0.format(new Set(rows.map(r => r.h)).size), s: `de ${HUBS0.length} na malha`, c: "var(--accent)", i: KPI_ICO.hub},
          {l: "Cidades atendidas", v: nf0.format(new Set(rows.map(r => r.key)).size), s: `${nf0.format(rows.length)} vínculos almoxarifado → cidade`, c: "var(--h2)", i: KPI_ICO.city},
        ]},
        {t: `Equipamentos · ${EQ.meta.periodo}`, x: `${nf0.format(apl)} aplicados`, cls: "eq", items: [
          {l: "Equip. novos", v: nf0.format(e.n), p: pn, s: `${pn != null ? pct.format(pn) : "–"} do aplicado`, c: "var(--accent)", i: KPI_ICO.novo},
          {l: "Equip. reaproveitados", v: nf0.format(e.r), p: pr, s: `${pr != null ? pct.format(pr) : "–"} do aplicado`, c: "var(--ok)", i: KPI_ICO.reap},
          {l: "Equip. retirados", v: nf0.format(e.t), s: `de clientes · ${nf0.format(e.cid)} cidades com dados`, c: "var(--warn)", i: KPI_ICO.ret},
        ]},
      ];
    });
    return {groups};
  },
};

const SimBar = {
  template: `<section v-if="sim.on" class="simbar" role="status">
      <div><b>Modo simulação.</b> Arraste qualquer sede no mapa; as rotas das sedes movidas são estimadas
        pela sinuosidade e velocidade reais de cada almoxarifado.</div>
      <div class="d"><span>Sedes movidas</span><strong>{{ moved }}</strong></div>
      <div class="d"><span>Km médio por estrada</span><strong>{{ nf1(base.km) }} → {{ nf1(now.km) }}
        <em :class="now.km > base.km ? 'up' : 'down'" v-if="moved">({{ delta(now.km - base.km) }})</em></strong></div>
      <div class="d"><span>Cidades até 2h</span><strong>{{ pct(base.ate2h) }} → {{ pct(now.ate2h) }}</strong></div>
      <div class="d"><span>Maior tempo</span><strong>{{ fmtMin(base.maxMin) }} → {{ fmtMin(now.maxMin) }}</strong></div>
      <button class="btn sm" type="button" @click="resetSim" :disabled="!moved">Desfazer movimentos</button>
    </section>`,
  setup() {
    const now = computed(() => stats(rowsEff.value));
    return {sim: store.sim, base: baseline, now, moved: computed(() => Object.keys(store.sim.pos).length),

const MapPanel = {

  setup() {
    const el = ref(null), offline = ref(false);

    let map, popup, ro, tileErr = 0, tileOk = 0, ready = false;

    const fcLinks = rows => ({type: "FeatureCollection", features: rows.map(r => ({type: "Feature",
      geometry: {type: "LineString", coordinates: [[r.hub.lon, r.hub.lat], [r.lon, r.lat]]}, properties: {b: r.fxI, i: r.i}}))});
    const fcRealoc = rows => { const ids = new Set(rows.map(r => r.i));
      return {type: "FeatureCollection", features: RAW.realoc.filter(x => ids.has(x.i)).map(x => { const r = BASE_ROWS[x.i], h = HUBm.value.get(x.sugerido_id);
        return {type: "Feature", geometry: {type: "LineString", coordinates: [[r.lon, r.lat], [h.lon, h.lat]]}, properties: {g: x.ganho_km}}; })}; };

    const style = () => {

      Object.entries(BASES).forEach(([k, b]) => {
        sources[`b-${k}`] = {type: "raster", tiles: [tile(b.url)], tileSize: 256, maxzoom: 18, attribution: "Tiles © Esri — Esri, HERE, Garmin, USGS, © OpenStreetMap"};

        if (b.ref) sources[`r-${k}`] = {type: "raster", tiles: [tile(b.ref)], tileSize: 256, maxzoom: 18};

      map.addLayer({id: "heat", type: "heatmap", source: "cities", maxzoom: 14, paint: {

      map.addLayer({id: "links", type: "line", source: "links", paint: {"line-color": "#3b82f6", "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.2, 9, 2.4], "line-opacity": 0.6}});
      // rótulos de referência do mapa base (cidades, estados) por cima do calor
      Object.entries(BASES).forEach(([k, b]) => { if (b.ref) map.addLayer({id: `r-${k}`, type: "raster", source: `r-${k}`, layout: {visibility: k === store.base ? "visible" : "none"}}); });
      map.addLayer({id: "realoc", type: "line", source: "realoc", layout: {"line-cap": "round"}, paint: {"line-color": "#7c3aed", "line-width": 2.2, "line-dasharray": [1.5, 1.5]}});

      map.addLayer({id: "cl", type: "circle", source: "cities-cl", filter: ["has", "point_count"], paint: {
        "circle-color": ["step", ["get", "point_count"], "#5b0fb3", 8, "#b0209e", 20, "#e8445a"], "circle-radius": ["step", ["get", "point_count"], 14, 8, 18, 20, 24],

        "circle-radius": 13, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": "#1e6bff", "circle-stroke-width": 3}});
    };
    const applyLayers = () => {
      if (!ready) return;
      const L = store.layers, vis = (id, on) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
      vis("heat", L.heat); vis("links", L.links || !!store.f.hub || !!store.f.q); vis("realoc", L.realoc);
      vis("pts", L.cities && !L.cluster); vis("pts-lbl", L.cities && !L.cluster);
      ["cl", "cl-n", "cl-pt"].forEach(id => vis(id, L.cities && L.cluster));

      // a legenda ocupa o canto inferior: reserva a altura dela no enquadramento
      const lg = el.value?.parentElement.querySelector(".legend")?.offsetHeight || 0, w = el.value?.clientWidth || 800;
      const pad = {top: 64, bottom: lg + 40, left: w < 700 ? 24 : 60, right: w < 700 ? 24 : 60};
      map.fitBounds(b, {padding: pad, maxZoom: 10.5, duration: animate && !reducedMotion() ? 700 : 0});
    };

    const showCity = r => { if (!ready) return; map.setFilter("focus", ["==", ["get", "i"], r.i]);
      popup.setLngLat([r.lon, r.lat]).setHTML(tipCity(rowsEff.value[r.i])).addTo(map); };
    const tipCity = r => `<div class="pp"><b>${esc(r.c)} · ${esc(r.uf)}</b><dl>
      <dt>Almoxarifado</dt><dd>${esc(r.hub.nome)} (${esc(r.hub.uf)})</dd>
      <dt>Tempo</dt><dd class="mono">${fmtMin(r.min)} · ${BANDS[r.fxI].k}${r.simulado ? " (simulado)" : r.est ? " (estimado)" : ""}</dd>
      <dt>Estrada</dt><dd class="mono">${nf1.format(r.km)} km</dd>
      <dt>Linha reta</dt><dd class="mono">${nf1.format(r.d)} km</dd>
      ${r.pop ? `<dt>População</dt><dd class="mono">${nf0.format(r.pop)}</dd>` : ""}
      <dt>Coordenada</dt><dd>${esc(r.s)}</dd></dl>${eqHtml(eqSum([r]))}</div>`;
    const tipLink = r => `<div class="pp"><b>${esc(r.hub.nome)} → ${esc(r.c)} · ${esc(r.uf)}</b><dl>
      <dt>Tempo</dt><dd class="mono">${fmtMin(r.min)} · ${BANDS[r.fxI].k}</dd>
      <dt>Estrada</dt><dd class="mono">${nf1.format(r.km)} km</dd></dl>${eqHtml(eqSum([r]))}</div>`;

    // O MapLibre desenha em threads (Web Workers criados a partir de blob:). Alguns visualizadores
    // embutidos bloqueiam isso por segurança; nesse caso o painel segue funcionando sem o mapa.
    const workersOk = () => { try { const u = URL.createObjectURL(new Blob([""], {type: "text/javascript"}));
      const w = new Worker(u); w.terminate(); URL.revokeObjectURL(u); return true; } catch { return false; } };
    const semMapa = ref(false);
    onMounted(() => {
      if (!window.maplibregl || !workersOk()) { semMapa.value = true; return; }
      map = markRaw(new maplibregl.Map({container: el.value, style: style(), center: [-45, -14], zoom: 3.6, minZoom: 2.5, maxZoom: 17,
        attributionControl: {compact: true}, dragRotate: false, pitchWithRotate: false, cooperativeGestures: false}));
      map.addControl(new maplibregl.NavigationControl({showCompass: false}), "bottom-right");
      map.touchZoomRotate.disableRotation();
      popup = markRaw(new maplibregl.Popup({closeButton: false, closeOnClick: false, offset: 10, maxWidth: "340px"}));
      map.on("error", e => { if (e?.sourceId?.startsWith?.("b-")) { if (++tileErr > 6 && !tileOk) useFallback(); } });
      map.on("sourcedata", e => { if (e.sourceId?.startsWith?.("b-") && e.tile) tileOk++; });
      map.on("load", () => {
        addData(); ready = true; updateHeat(); syncMarkers(); applyLayers(); fit(false);
        // fallback de segurança: se nenhum tile carregar em 6 s, usa a malha do IBGE
        setTimeout(() => { if (!tileOk && tileErr) useFallback(); }, 8000);
      });
      map.on("zoomend", updateHeat);
      map.on("moveend", declutter);
      const hover = e => {
        const f = e.features?.[0]; if (!f) return;
        const r = rowsEff.value[f.properties.i]; map.getCanvas().style.cursor = "pointer";
        popup.setLngLat([r.lon, r.lat]).setHTML(tipCity(r)).addTo(map);
      };
      ["pts", "cl-pt"].forEach(id => {
        map.on("mousemove", id, hover);
        map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; popup.remove(); });
        map.on("click", id, e => { const f = e.features?.[0]; if (f) store.focus = rowsEff.value[f.properties.i]; });
      });
      map.on("mousemove", "links", e => {
        if (map.queryRenderedFeatures(e.point, {layers: ["pts", "cl-pt"].filter(id => map.getLayer(id))}).length) return;
        const f = e.features?.[0]; if (!f) return; const r = rowsEff.value[f.properties.i];
        map.getCanvas().style.cursor = "pointer"; popup.setLngLat(e.lngLat).setHTML(tipLink(r)).addTo(map); });
      map.on("mouseleave", "links", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
      map.on("click", "links", e => { const f = e.features?.[0]; if (f) store.focus = rowsEff.value[f.properties.i]; });
      map.on("click", "cl", e => { const f = e.features[0];
        map.getSource("cities-cl").getClusterExpansionZoom(f.properties.cluster_id).then(z => map.easeTo({center: f.geometry.coordinates, zoom: z})); });
      let firstSize = true;
      ro = new ResizeObserver(() => { map.resize(); if (ready && firstSize) { firstSize = false; fit(false); } }); ro.observe(el.value);
    });
    onBeforeUnmount(() => { ro?.disconnect(); map?.remove(); });

    let rafId = 0;
    const schedule = () => { if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; refreshData(); }); };
    watch(sel.rows, schedule);
    watch(() => ({...store.f}), () => nextTick(() => {
      fit(true);
      // busca com um único resultado: abre a ficha da cidade (sede e ligação ficam enquadradas)
      const rows = sel.rows.value;
      if (store.f.q && rows.length === 1) setTimeout(() => showCity(rows[0]), reducedMotion() ? 0 : 750);
      else if (!store.focus) { popup?.remove(); if (ready) map.setFilter("focus", ["==", ["get", "i"], -1]); }
    }));
    watch(() => ({...store.layers}), applyLayers);
    watch(() => store.sim.on, () => { syncMarkers(); });
    watch(() => store.radiusKm, updateHeat);
    watch(() => store.focus, r => {
      if (!ready) return;
      map.setFilter("focus", ["==", ["get", "i"], r ? r.i : -1]);
      if (r) { map.flyTo({center: [r.lon, r.lat], zoom: Math.max(map.getZoom(), 10.5), duration: reducedMotion() ? 0 : 700});
        popup.setLngLat([r.lon, r.lat]).setHTML(tipCity(rowsEff.value[r.i])).addTo(map); }
    });

    return {el, offline, semMapa, radius, layers: store.layers, sim: store.sim, bases: BASES, bands: BANDS, enr: ENR,
      base: computed(() => store.base), weight: computed(() => store.weight), setBase, setWeight, fit,
      layerLabels: {heat: "Calor", cities: "Cidades", hubs: "Almoxarifados", links: "Ligações", realoc: "Realocações", cluster: "Agrupar"}};
  },
};

/* Distância e tempo por cidade — lista limpa: cidade → almoxarifado, km e horas por estrada */
const Intel = {
  template: `<section class="card td" v-if="rows.length">
      <h3>Distância e tempo até o almoxarifado <span>por estrada · {{ rows.length }} {{ rows.length === 1 ? "cidade" : "cidades" }}</span></h3>
      <div class="td-list">
        <table>
          <thead><tr>
            <th v-for="c in cols" :key="c.k" :class="[{r: c.r}, c.cls]" scope="col" @click="sortBy(c.k)"
                :aria-sort="sk === c.k ? (sd > 0 ? 'ascending' : 'descending') : 'none'"><span class="lg">{{ c.t }}</span><span class="sh">{{ c.s || c.t }}</span><span v-if="sk === c.k">{{ sd > 0 ? " ↑" : " ↓" }}</span></th>
          </tr></thead>
          <tbody>
            <tr v-for="r in sorted" :key="r.i" class="go" @click="focus(r)" :title="'Localizar ' + r.c + ' no mapa'">
              <td><b>{{ r.c }}</b> <small>{{ r.uf }}</small><span class="alm-m">{{ r.hub.nome }}</span></td>
              <td class="muted col-alm">{{ r.hub.nome }}</td>
              <td class="r">{{ nf1(r.km) }} km</td>
              <td class="r">{{ fmtMin(r.min) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>`,
  setup() {
    const rows = computed(() => sel.rows.value);
    const cols = [{k: "c", t: "Cidade"}, {k: "hubNome", t: "Almoxarifado", cls: "col-alm"}, {k: "km", t: "Distância (km)", s: "Km", r: true}, {k: "min", t: "Tempo (horas)", s: "Tempo", r: true}];
    const sk = ref("hubNome"), sd = ref(1);
    const sorted = computed(() => rows.value.map(r => ({...r, hubNome: r.hub.nome})).sort((a, b) => {
      const x = a[sk.value], y = b[sk.value];
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR")) * sd.value || a.km - b.km;
    }));
    const sortBy = k => { if (sk.value === k) sd.value = -sd.value; else { sk.value = k; sd.value = 1; } };
    return {rows, cols, sorted, sk, sd, sortBy, focus: r => { store.focus = r;
      document.querySelector(".mapcard").scrollIntoView({behavior: reducedMotion() ? "auto" : "smooth", block: "center"}); },
      nf1: v => nf1.format(v), fmtMin};
  },
};

/* DataTabs — colunas declarativas + rolagem virtual (renderiza só as linhas visíveis) */
const bandPill = i => [["ok", "warn", "warn", "crit"][i], BANDS[i].k];
const TABLES = {
  cob: {label: "Cobertura", go: "city", sort: ["hubNome", 1],
    rows: () => sel.rows.value.map(r => ({...r, hubNome: r.hub.nome, hubUf: r.hub.uf})),
    cols: [{k: "hubNome", t: "Almoxarifado"}, {k: "hubUf", t: "UF sede"}, {k: "c", t: "Cidade"}, {k: "uf", t: "UF"},
      {k: "km", t: "Km estrada", r: true, f: v => nf1.format(v)}, {k: "min", t: "Tempo", r: true, f: fmtMin},
      {k: "fxI", t: "Faixa", pill: bandPill, f: v => BANDS[v].k}, {k: "d", t: "Linha reta (km)", r: true, f: v => nf1.format(v)},
      {k: "pop", t: "População", r: true, f: v => (v ? nf0.format(v) : "–")},
      {k: "s", t: "Coordenada", pill: v => (v === "Precisa" ? ["", v] : v.startsWith("Corrigida") ? ["ok", v] : ["warn", v])}]},
  alm: {label: "Almoxarifados", go: "hub", sort: ["n", -1],
    rows: () => [...groupBy(sel.rows.value, r => r.h)].map(([id, g]) => { const h = HUBm.value.get(id), s = stats(g);
      return {id, nome: h.nome, uf: h.uf, origem: h.origem, n: g.length, ufs: new Set(g.map(r => r.uf)).size, km: s.km, min: s.min, ate2h: s.ate2h, mx: s.maxMin, pop: s.pop,
        re: RAW.realoc.filter(x => x.atual_id === id).length}; }),
    cols: [{k: "nome", t: "Almoxarifado"}, {k: "uf", t: "UF"}, {k: "n", t: "Cidades", r: true, bar: true}, {k: "ufs", t: "UFs", r: true},
      {k: "km", t: "Km médio", r: true, f: v => nf1.format(v)}, {k: "min", t: "Tempo médio", r: true, f: fmtMin},
      {k: "ate2h", t: "Até 2h", r: true, f: v => pct.format(v)}, {k: "mx", t: "Maior tempo", r: true, f: fmtMin},
      {k: "pop", t: "População", r: true, f: v => (v ? nf0.format(v) : "–")}, {k: "re", t: "Realocar?", r: true},
      {k: "origem", t: "Coordenada da sede", pill: v => (v.includes("inferida") ? ["warn", v] : v.startsWith("IBGE") ? ["ok", v] : null)}]},
  uf: {label: "Estados", sort: ["n", -1],
    rows: () => { const rs = sel.rows.value, tot = rs.length || 1;
      return [...groupBy(rs, r => r.uf)].map(([uf, g]) => { const s = stats(g);
        return {uf, n: g.length, p: g.length / tot, hubs: new Set(g.map(r => r.h)).size, km: s.km, min: s.min, ate2h: s.ate2h, pop: s.pop}; }); },
    cols: [{k: "uf", t: "UF"}, {k: "n", t: "Cidades", r: true, bar: true}, {k: "p", t: "% da malha", r: true, f: v => pct.format(v)},
      {k: "hubs", t: "Almoxarifados", r: true}, {k: "km", t: "Km médio", r: true, f: v => nf1.format(v)}, {k: "min", t: "Tempo médio", r: true, f: fmtMin},
      {k: "ate2h", t: "Até 2h", r: true, f: v => pct.format(v)}, {k: "pop", t: "População", r: true, f: v => (v ? nf0.format(v) : "–")}]},
  realoc: {label: "Realocações", go: "realoc", sort: ["ganho_km", -1],
    rows: () => { const ids = new Set(sel.rows.value.map(r => r.i)); return RAW.realoc.filter(x => ids.has(x.i)); },
    cols: [{k: "cidade", t: "Cidade"}, {k: "uf", t: "UF"}, {k: "atual", t: "Atende hoje"}, {k: "km_atual", t: "Km hoje", r: true, f: v => nf1.format(v)},
      {k: "sugerido", t: "Sede sugerida"}, {k: "km_sugerido", t: "Km sugerido", r: true, f: v => nf1.format(v)},
      {k: "ganho_km", t: "Economia (km)", r: true, f: v => nf1.format(v)}, {k: "ganho_pct", t: "Economia", r: true, f: v => pct.format(v)},
      {k: "min_sugerido", t: "Tempo sugerido", r: true, f: fmtMin}]},
  corr: {label: "Correções de dados", sort: ["tipo", 1],
    rows: () => RAW.corr.map((x, i) => ({...x, i, st: x.confirmar ? "Confirmar" : "Aplicada"})),
    cols: [{k: "tipo", t: "Tipo"}, {k: "item", t: "Item"}, {k: "uf", t: "UF"}, {k: "almox", t: "Almoxarifado"},
      {k: "de", t: "Antes"}, {k: "para", t: "Depois", wrap: true}, {k: "desloc_km", t: "Desloc. (km)", r: true, f: v => nf1.format(v)},
      {k: "st", t: "Status", pill: v => (v === "Aplicada" ? ["ok", v] : ["warn", v])}]},
};
const ROW_H = 37, OVERSCAN = 8;
const DataTabs = {
  template: `<section class="panel">
      <div class="tabs" role="tablist">
        <button v-for="(d, k) in defs" :key="k" class="tab" :class="{on: tab === k}" role="tab" type="button" :aria-selected="tab === k" @click="setTab(k)">
          {{ d.label }} <span class="badge">{{ counts[k] }}</span></button>
      </div>
      <div class="tbar"><span>{{ info }}</span><div class="acts">
        <button class="btn sm" type="button" @click="download">Baixar CSV</button><button class="btn sm" type="button" @click="copy">Copiar</button></div></div>
      <div class="twrap" ref="wrap" @scroll.passive="onScroll"><table>
        <thead><tr><th v-for="c in def.cols" :key="c.k" :class="{r: c.r}" scope="col" @click="sortBy(c)"
            :aria-sort="sortState[0] === c.k ? (sortState[1] > 0 ? 'ascending' : 'descending') : 'none'">
            {{ c.t }}<span v-if="sortState[0] === c.k">{{ sortState[1] > 0 ? ' ↑' : ' ↓' }}</span></th></tr></thead>
        <tbody>
          <tr class="spacer" v-if="win.top"><td :colspan="def.cols.length" :style="{height: win.top + 'px'}"></td></tr>
          <tr v-for="r in win.items" :key="r._k" :class="{go: def.go}" @click="open(r)">
            <td v-for="c in def.cols" :key="c.k" :class="{r: c.r, wrap: c.wrap}">
              <template v-if="c.bar"><span class="hbar" :style="{width: Math.round(r[c.k] / maxN * 80) + 'px'}"></span>{{ r[c.k] }}</template>
              <template v-else-if="c.pill && c.pill(r[c.k])"><span class="pill" :class="c.pill(r[c.k])[0]">{{ c.pill(r[c.k])[1] }}</span></template>
              <template v-else>{{ c.f ? c.f(r[c.k]) : r[c.k] }}</template>
            </td></tr>
          <tr class="spacer" v-if="win.bottom"><td :colspan="def.cols.length" :style="{height: win.bottom + 'px'}"></td></tr>
          <tr v-if="!rows.length"><td class="empty" :colspan="def.cols.length">Nenhum registro para os filtros atuais. Use “Limpar filtros” para ver toda a malha.</td></tr>
        </tbody></table></div>
    </section>`,
  setup() {
    const wrap = ref(null), scrollTop = ref(0), viewH = ref(520);
    const def = computed(() => TABLES[store.tab]);
    const sortState = computed(() => store.sort[store.tab] || def.value.sort);
    const rows = computed(() => {
      const [k, d] = sortState.value;
      return def.value.rows().map((r, i) => ({...r, _k: `${store.tab}-${r.i ?? r.id ?? r.uf ?? i}-${i}`}))
        .sort((a, b) => { const x = a[k], y = b[k];
          return (typeof x === "number" || typeof y === "number" ? (x ?? -1) - (y ?? -1) : String(x ?? "").localeCompare(String(y ?? ""), "pt-BR")) * d || (a.km ?? 0) - (b.km ?? 0); });
    });
    const win = computed(() => {
      const n = rows.value.length, start = Math.max(0, Math.floor(scrollTop.value / ROW_H) - OVERSCAN);
      const end = Math.min(n, Math.ceil((scrollTop.value + viewH.value) / ROW_H) + OVERSCAN);
      return {items: rows.value.slice(start, end), top: start * ROW_H, bottom: (n - end) * ROW_H};
    });
    const onScroll = e => { scrollTop.value = e.target.scrollTop; };
    watch(() => store.tab, () => { scrollTop.value = 0; if (wrap.value) wrap.value.scrollTop = 0; });
    onMounted(() => { const ro = new ResizeObserver(() => { viewH.value = wrap.value?.clientHeight || 520; }); ro.observe(wrap.value); });
    const maxN = computed(() => Math.max(1, ...rows.value.map(r => r.n || 0)));
    const counts = computed(() => ({cob: sel.rows.value.length, alm: new Set(sel.rows.value.map(r => r.h)).size, uf: new Set(sel.rows.value.map(r => r.uf)).size,
      realoc: TABLES.realoc.rows().length, corr: RAW.corr.length}));
    const info = computed(() => `${nf0.format(rows.value.length)} ${rows.value.length === 1 ? "linha" : "linhas"}` + ({city: " · clique para localizar no mapa",
      hub: " · clique para abrir o almoxarifado", realoc: " · clique para ver a rota sugerida no mapa"}[def.value.go] || ""));
    const sortBy = c => { const [ck, cd] = sortState.value;
      store.sort[store.tab] = [c.k, ck === c.k ? -cd : (typeof rows.value[0]?.[c.k] === "number" ? -1 : 1)]; };
    const setTab = k => { store.tab = k; safeLS.set("cob.tab", k); if (k === "realoc") store.layers.realoc = true; };
    const toMap = () => document.querySelector(".mapcard").scrollIntoView({behavior: reducedMotion() ? "auto" : "smooth", block: "center"});
    const open = r => {
      const go = def.value.go;
      if (go === "city") { store.focus = rowsEff.value[r.i]; toMap(); }
      else if (go === "hub") { actions.toggleHub(r.id); toMap(); }
      else if (go === "realoc") { store.layers.realoc = true; store.focus = rowsEff.value[r.i]; toMap(); }
    };
    const csv = () => { const q = v => (/[;"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? ""));
      const cols = def.value.cols;
      return [cols.map(c => c.t).join(";"), ...rows.value.map(r => cols.map(c => q(c.f ? c.f(r[c.k]) : r[c.k])).join(";"))].join("\r\n"); };
    const copy = async () => { try { await navigator.clipboard.writeText(csv()); actions.toast(`${rows.value.length} linhas copiadas. Cole no Excel.`); }
      catch { actions.toast("Não foi possível copiar. Selecione a tabela e use Ctrl+C."); } };
    const download = () => {
      try {
        const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(new Blob(["﻿" + csv()], {type: "text/csv;charset=utf-8"})),
          download: `cobertura_${store.tab}.csv`});
        document.body.appendChild(a); a.click(); a.remove();
        actions.toast("Download iniciado. Se nada acontecer, use Copiar.");
      } catch { copy(); }
    };
    return {wrap, defs: TABLES, def, rows, win, onScroll, sortState, maxN, counts, info, sortBy, setTab, open, copy, download, tab: computed(() => store.tab)};
  },
};

/* --------------------------------- app -------------------------------- */
createApp({
  components: {AppBar, FilterBar, KpiStrip, SimBar, MapPanel, SidePanel, Intel, DataTabs},
  template: `<app-bar></app-bar>
    <main class="wrap">
      <filter-bar></filter-bar>
      <kpi-strip></kpi-strip>
      <sim-bar></sim-bar>
      <section class="main"><map-panel></map-panel><side-panel></side-panel></section>
      <intel></intel>
      <data-tabs></data-tabs>
      <p class="foot">Km e tempo por estrada calculados com OSRM sobre a malha viária do OpenStreetMap (sem trânsito). Coordenadas oficiais e população (Censo 2022) do IBGE;
        distritos e bairros geolocalizados pelo OpenStreetMap estão marcados para confirmação. Sedes “inferidas” (por prefixo ou sigla) devem ser confirmadas.
        Na simulação, as rotas das sedes movidas são estimadas pela sinuosidade e velocidade médias reais de cada almoxarifado.
        Realocação sugerida quando outra sede fica ao menos 20 km e 15% mais perto por estrada.</p>
    </main>
    <div v-if="toast" class="toast" role="status">{{ toast }}</div>`,
  setup: () => ({toast: computed(() => store.toast)}),
}).mount("#app");
document.getElementById("boot").remove();
</script>
</body>
</html>
